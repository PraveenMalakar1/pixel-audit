<!doctype html>
<!--
  "Developer build" of the login design with bugs planted on purpose.
  Expected findings:
   1. Logo icon (check mark) is missing                    → missing
   2. Heading font-weight 500 instead of 700               → typography
   3. Inputs border-radius 2px instead of 8px              → shape
   4. "Forgot password?" link colour #2563eb not #4f46e5   → color
   5. Sign in button colour #6366f1 not #4f46e5            → color
   6. Create account button height 40px not 44px           → size (pushes footer up 4px)
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Login – build</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: #f3f4f6; font-family: Arial, Helvetica, sans-serif; color: #111827; }
  .page { min-height: 760px; display: flex; align-items: center; justify-content: center; padding: 40px 16px; }
  .card { width: 400px; background: #fff; border-radius: 16px; padding: 32px; box-shadow: 0 10px 30px rgba(17, 24, 39, .08); }
  .logo { width: 48px; height: 48px; border-radius: 12px; background: #4f46e5; display: grid; place-items: center; margin-bottom: 20px; }
  h1 { font-size: 24px; font-weight: 500; margin: 0 0 6px; }
  .sub { color: #6b7280; font-size: 14px; margin: 0 0 24px; }
  label { display: block; font-size: 13px; font-weight: 700; margin-bottom: 6px; }
  .field { margin-bottom: 16px; }
  input { width: 100%; height: 44px; border: 1px solid #d1d5db; border-radius: 2px; padding: 0 12px; font: 14px Arial, sans-serif; }
  .row { display: flex; justify-content: space-between; align-items: center; margin: 4px 0 24px; font-size: 13px; }
  .row a { color: #2563eb; text-decoration: none; font-weight: 700; }
  .btn { width: 100%; height: 44px; border: 0; border-radius: 8px; background: #6366f1; color: #fff; font: 700 15px Arial, sans-serif; }
  .btn.secondary { height: 40px; margin-top: 12px; background: #fff; color: #111827; border: 1px solid #d1d5db; }
  .foot { text-align: center; color: #6b7280; font-size: 13px; margin-top: 20px; }
</style>
</head>
<body>
<div class="page">
  <form class="card">
    <div class="logo"></div>
    <h1>Welcome back</h1>
    <p class="sub">Sign in to continue to your dashboard.</p>
    <div class="field"><label for="email">Email</label><input id="email" placeholder="you@company.com"></div>
    <div class="field"><label for="pw">Password</label><input id="pw" type="password" placeholder="••••••••"></div>
    <div class="row"><span><input type="checkbox" style="width:auto;height:auto"> Remember me</span><a href="#">Forgot password?</a></div>
    <button class="btn" type="button">Sign in</button>
    <button class="btn secondary" type="button">Create account</button>
    <p class="foot">By signing in you agree to our Terms.</p>
  </form>
</div>
</body>
</html>
